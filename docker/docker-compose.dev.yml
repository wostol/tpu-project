services:
  postgres:
    image: postgres:16-alpine
    container_name: tpu-postgres
    environment:
      POSTGRES_DB: tpu_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tpu-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: tpu-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pg_data:
